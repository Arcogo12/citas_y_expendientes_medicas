<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1380" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#94A3B8" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#22C55E" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#EF4444" />
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#F97316" />
    </marker>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- 1. INICIO -->
  <rect x="130" y="35" width="360" height="48" rx="24" fill="#EBF3FE" stroke="#3B82F6" stroke-width="2" />
  <text x="310" y="65" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="bold">Inicio: Push / Pull Request en GitHub</text>

  <!-- LINE TO STEP 1 -->
  <line x1="310" y1="83" x2="310" y2="118" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- STEPS 1 TO 5 -->
  <!-- STEP 1 -->
  <rect x="90" y="118" width="440" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" filter="url(#card-shadow)" />
  <text x="106" y="141" fill="#1E293B" font-size="13" font-weight="bold">1. Iniciar Runner en la Nube</text>
  <text x="106" y="161" fill="#64748B" font-size="11.5">runs-on: ubuntu-latest (Job: Validar proyecto PHP)</text>

  <line x1="310" y1="176" x2="310" y2="202" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- STEP 2 -->
  <rect x="90" y="202" width="440" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" filter="url(#card-shadow)" />
  <text x="106" y="225" fill="#1E293B" font-size="13" font-weight="bold">2. Descargar Código Fuente</text>
  <text x="106" y="245" fill="#64748B" font-size="11.5">uses: actions/checkout@v4</text>

  <line x1="310" y1="260" x2="310" y2="286" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- STEP 3 -->
  <rect x="90" y="286" width="440" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" filter="url(#card-shadow)" />
  <text x="106" y="309" fill="#1E293B" font-size="13" font-weight="bold">3. Configurar Entorno PHP 8.4</text>
  <text x="106" y="329" fill="#64748B" font-size="11.5">uses: shivammathur/setup-php@v2 (php-version: 8.4)</text>

  <line x1="310" y1="344" x2="310" y2="370" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- STEP 4 -->
  <rect x="90" y="370" width="440" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" filter="url(#card-shadow)" />
  <text x="106" y="393" fill="#1E293B" font-size="13" font-weight="bold">4. Instalar Dependencias del Proyecto</text>
  <text x="106" y="413" fill="#64748B" font-size="11.5">run: composer install --prefer-dist (PHPUnit 11 y Dotenv)</text>

  <line x1="310" y1="428" x2="310" y2="454" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- STEP 5 -->
  <rect x="90" y="454" width="440" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" filter="url(#card-shadow)" />
  <text x="106" y="477" fill="#1E293B" font-size="13" font-weight="bold">5. Verificación de Sintaxis PHP</text>
  <text x="106" y="497" fill="#64748B" font-size="11.5">run: find . -name '*.php' | xargs -n 1 php -l</text>

  <line x1="310" y1="512" x2="310" y2="538" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- DECISION 1 -->
  <polygon points="310,538 490,571 310,604 130,571" fill="#FEF9C3" stroke="#EAB308" stroke-width="2" />
  <text x="310" y="575" text-anchor="middle" fill="#854D0E" font-size="13" font-weight="bold">¿Sintaxis correcta en todos los archivos?</text>

  <!-- ==================== LÍNEA PROPIA 1: ERROR DE SINTAXIS ==================== -->
  <line x1="490" y1="571" x2="598" y2="571" stroke="#EF4444" stroke-width="2.2" marker-end="url(#arrow-red)" />
  <text x="545" y="563" text-anchor="middle" fill="#DC2626" font-size="13" font-weight="bold">No</text>

  <!-- ERROR SINTAXIS CARD -->
  <rect x="600" y="532" width="360" height="76" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8" filter="url(#card-shadow)" />
  <text x="616" y="557" fill="#991B1B" font-size="13.5" font-weight="bold">Error de Sintaxis</text>
  <text x="616" y="579" fill="#7F1D1D" font-size="11.5">• php -l detecta fallo en archivos .php</text>
  <text x="616" y="597" fill="#7F1D1D" font-size="11.5">• Detención inmediata: no se ejecutan pruebas</text>

  <!-- LÍNEA PROPIA DE ERROR SINTAXIS HACIA SU PROPIO FIN (TOTALMENTE INDEPENDIENTE) -->
  <line x1="780" y1="608" x2="780" y2="634" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-red)" />

  <rect x="600" y="634" width="360" height="46" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" />
  <text x="780" y="663" text-anchor="middle" fill="#991B1B" font-size="13" font-weight="bold">Fin del Pipeline (Status: Failed - Sintaxis)</text>

  <!-- ==================== CONTINUACIÓN PIPELINE PRINCIPAL ==================== -->
  <line x1="310" y1="604" x2="310" y2="640" stroke="#22C55E" stroke-width="2.2" marker-end="url(#arrow-green)" />
  <text x="325" y="626" fill="#16A34A" font-size="13" font-weight="bold">Sí</text>

  <!-- STEP 6 -->
  <rect x="90" y="640" width="440" height="58" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" filter="url(#card-shadow)" />
  <text x="106" y="663" fill="#1E293B" font-size="13" font-weight="bold">6. Ejecutar Pruebas PHPUnit</text>
  <text x="106" y="683" fill="#64748B" font-size="11.5">run: composer test (4 Pruebas Unitarias)</text>

  <line x1="310" y1="698" x2="310" y2="726" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#arrow-gray)" />

  <!-- DECISION 2 -->
  <polygon points="310,726 490,759 310,792 130,759" fill="#FEF9C3" stroke="#EAB308" stroke-width="2" />
  <text x="310" y="763" text-anchor="middle" fill="#854D0E" font-size="13" font-weight="bold">¿4 de 4 pruebas unitarias pasaron?</text>

  <!-- ==================== LÍNEA PROPIA 2: FALLO EN PRUEBAS ==================== -->
  <line x1="490" y1="759" x2="598" y2="759" stroke="#EF4444" stroke-width="2.2" marker-end="url(#arrow-red)" />
  <text x="545" y="751" text-anchor="middle" fill="#DC2626" font-size="13" font-weight="bold">No</text>

  <!-- F1: FALLO EN PRUEBAS -->
  <rect x="600" y="722" width="360" height="76" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8" filter="url(#card-shadow)" />
  <text x="616" y="747" fill="#991B1B" font-size="13.5" font-weight="bold">Fallo de Prueba (Exit Code 1)</text>
  <text x="616" y="769" fill="#7F1D1D" font-size="11.5">• Aserción no cumplida en PHPUnit</text>
  <text x="616" y="787" fill="#7F1D1D" font-size="11.5">• Registra método, archivo y línea en logs</text>

  <!-- LINE F1 TO F2 -->
  <line x1="780" y1="798" x2="780" y2="820" stroke="#EF4444" stroke-width="2.2" marker-end="url(#arrow-red)" />

  <!-- F2: CHECK FAILED -->
  <rect x="600" y="820" width="360" height="76" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8" filter="url(#card-shadow)" />
  <text x="616" y="845" fill="#991B1B" font-size="13.5" font-weight="bold">Estado en GitHub: Check Failed</text>
  <text x="616" y="867" fill="#7F1D1D" font-size="11.5">• Se detiene la ejecución del Runner</text>
  <text x="616" y="885" fill="#7F1D1D" font-size="11.5">• Alerta/notificación enviada al desarrollador</text>

  <!-- LINE F2 TO F3 -->
  <line x1="780" y1="896" x2="780" y2="918" stroke="#EF4444" stroke-width="2.2" marker-end="url(#arrow-red)" />

  <!-- F3: BLOQUEO DE MERGE -->
  <rect x="600" y="918" width="360" height="76" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8" filter="url(#card-shadow)" />
  <text x="616" y="943" fill="#991B1B" font-size="13.5" font-weight="bold">Bloqueo de Merge (Quality Gate)</text>
  <text x="616" y="965" fill="#7F1D1D" font-size="11.5">• Se bloquea la fusión hacia la rama 'main'</text>
  <text x="616" y="983" fill="#7F1D1D" font-size="11.5">• Se impide que código defectuoso pase</text>

  <!-- LINE F3 TO F4 -->
  <line x1="780" y1="994" x2="780" y2="1016" stroke="#EF4444" stroke-width="2.2" marker-end="url(#arrow-red)" />

  <!-- F4: CICLO DE CORRECCIÓN -->
  <rect x="600" y="1016" width="360" height="94" rx="10" fill="#FFEDD5" stroke="#F97316" stroke-width="2" filter="url(#card-shadow)" />
  <text x="616" y="1041" fill="#9A3412" font-size="13.5" font-weight="bold">Ciclo de Corrección (Feedback Loop)</text>
  <text x="616" y="1063" fill="#C2410C" font-size="11.5">1. Desarrollador analiza la falla en los logs</text>
  <text x="616" y="1081" fill="#C2410C" font-size="11.5">2. Corrige en local y valida con 'composer test'</text>
  <text x="616" y="1099" fill="#9A3412" font-size="11.5" font-weight="bold">3. Realiza nuevo Commit y Push</text>

  <!-- FEEDBACK LOOP PATH TO INICIO -->
  <path d="M 960 1063 L 995 1063 L 995 59 L 498 59" fill="none" stroke="#F97316" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrow-orange)" />
  <text x="985" y="45" text-anchor="end" fill="#C2410C" font-size="11.5" font-weight="bold">Reintento: Nuevo Commit &amp; Push</text>

  <!-- LINE F4 TO STATUS FAILED -->
  <line x1="780" y1="1110" x2="780" y2="1136" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-red)" />

  <!-- STATUS FAILED PRUEBAS -->
  <rect x="600" y="1136" width="360" height="46" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2" />
  <text x="780" y="1165" text-anchor="middle" fill="#991B1B" font-size="13" font-weight="bold">Fin del Pipeline (Status: Failed - Pruebas)</text>

  <!-- ==================== SÍ: PIPELINE EXITOSO ==================== -->
  <line x1="310" y1="792" x2="310" y2="828" stroke="#22C55E" stroke-width="2.2" marker-end="url(#arrow-green)" />
  <text x="325" y="814" fill="#16A34A" font-size="13" font-weight="bold">Sí</text>

  <rect x="90" y="828" width="440" height="66" rx="10" fill="#DCFCE7" stroke="#22C55E" stroke-width="2" filter="url(#card-shadow)" />
  <text x="106" y="855" fill="#166534" font-size="13.5" font-weight="bold">Pipeline Exitoso (100% Passed)</text>
  <text x="106" y="878" fill="#15803D" font-size="12">Código verificado y listo para producción</text>

  <line x1="310" y1="894" x2="310" y2="926" stroke="#22C55E" stroke-width="2.2" marker-end="url(#arrow-green)" />

  <!-- FIN DEL PIPELINE (PASSED) -->
  <rect x="130" y="926" width="360" height="48" rx="24" fill="#0F172A" stroke="#334155" stroke-width="2" />
  <text x="310" y="956" text-anchor="middle" fill="#F8FAFC" font-size="13.5" font-weight="bold">Fin del Pipeline (Status: Passed en GitHub)</text>
</svg>